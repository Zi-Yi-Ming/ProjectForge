[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jdforge"
version = "0.5.2"
description = "JD-driven project coach and constrained execution engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ProjectForge Contributors" }]
keywords = ["jd", "learning", "coding-agent", "orchestrator", "sandbox", "validation", "replan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # All three are runtime-load-bearing for the CLI + engine path.
    "pydantic>=2.13,<3",
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    # pytest is a *runtime* dependency, not just dev: the deterministic
    # validator shells out to `python -m pytest` (validator.py) to run a task's
    # declared tests, so it must be importable by the interpreter that runs the
    # projectforge command.
    "pytest>=8,<10",
]

[project.optional-dependencies]
# HTTP API server. Only app.api.* imports fastapi, so CLI-only installs (the
# primary audience) don't pull it in.
api = ["fastapi>=0.110,<1"]
# Contributor/dev install: the full suite exercises the API + validation paths.
dev = ["fastapi>=0.110,<1", "pytest>=8,<10"]

[project.urls]
Homepage = "https://github.com/Zi-Yi-Ming/ProjectForge"
Repository = "https://github.com/Zi-Yi-Ming/ProjectForge"
Issues = "https://github.com/Zi-Yi-Ming/ProjectForge/issues"
Changelog = "https://github.com/Zi-Yi-Ming/ProjectForge/releases"

[project.scripts]
projectforge = "app.cli.app:app"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]
