[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projectforge"
version = "0.3.0"
description = "JD-driven project coach and constrained execution engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ProjectForge Contributors" }]
keywords = ["jd", "learning", "coding-agent", "orchestrator", "sandbox", "validation", "replan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "typer==0.27.1",
]

[project.urls]
Homepage = "https://github.com/Zi-Yi-Ming/ProjectForge"
Repository = "https://github.com/Zi-Yi-Ming/ProjectForge"
Issues = "https://github.com/Zi-Yi-Ming/ProjectForge/issues"
Changelog = "https://github.com/Zi-Yi-Ming/ProjectForge/releases"

[project.scripts]
projectforge = "app.cli.app:app"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]
